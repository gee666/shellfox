name: Apple platform acceptance

# Apple CI runs on the experiment branch. No job publishes a release.
on:
  push:
    branches: [experiment/ghostty-rust]
    paths:
      - .github/workflows/apple-platforms.yml
      - .github/workflows/rust-platforms.yml
      - Cargo.*
      - rust-toolchain.toml
      - crates/**
      - vendor/**
      - scripts/**
      - resources/**
      - native/**
      - mobile/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    if: github.ref == 'refs/heads/experiment/ghostty-rust'
    name: macOS ${{ matrix.arch }} workspace and unsigned installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/lane-apple/target
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      GHOSTTY_VT_LINK_KIND: static
      SHELLFOX_MAC_UNSIGNED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare static Ghostty
        id: prepare
        run: |
          rustup show
          node scripts/rust-package-prereqs.mjs
        timeout-minutes: 25
      - name: Check desktop, including the wry/WKWebView HTML preview
        run: cargo check --locked -p shellfox-desktop
        timeout-minutes: 25
      - name: Check the Go helper's native ACL query
        working-directory: native/tailscale
        run: |
          mkdir -p ../../tmp/go-cache ../../tmp/go-mod ../../tmp/go-work
          GOCACHE="$GITHUB_WORKSPACE/tmp/go-cache" GOMODCACHE="$GITHUB_WORKSPACE/tmp/go-mod" \
            GOTMPDIR="$GITHUB_WORKSPACE/tmp/go-work" CGO_ENABLED=0 \
            go test -mod=readonly -run '^TestOwnershipDarwin' -count=1 -timeout=20s .
        timeout-minutes: 10
      - name: Install JavaScript test fixtures
        run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 10
      - name: Workspace tests
        id: workspace-tests
        shell: bash
        run: cargo test --locked --workspace --all-targets --no-fail-fast 2>&1 | tee tmp/apple-workspace-tests.log
        timeout-minutes: 45
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && steps.workspace-tests.outcome == 'failure'
        with:
          name: macos-workspace-failure-${{ matrix.arch }}
          path: tmp/apple-workspace-tests.log
      - name: Build desktop and CLI and package .app and .dmg
        id: package
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node scripts/package-rust.mjs
        timeout-minutes: 45
      - name: Smoke extracted desktop and CLI and verify disk image
        id: smoke
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node scripts/package-rust-smoke.mjs
        timeout-minutes: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        with:
          name: unsigned-shellfox-macos-${{ matrix.arch }}
          path: tmp/rust-installers/
          if-no-files-found: error
      - name: Remove Cargo build directory
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
        timeout-minutes: 5

  macos-p4:
    if: github.ref == 'refs/heads/experiment/ghostty-rust'
    name: macOS ${{ matrix.arch }} Files runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/lane-apple/target
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      GHOSTTY_VT_LINK_KIND: static
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # The Electron ownership helper predates the Rust owner protocol.
      - name: Require a logged-in Aqua session for P4
        run: |
          mkdir -p tmp/lane-apple/p4
          xcrun swiftc -parse-as-library -target "$(uname -m)-apple-macosx14.2" scripts/macos-p4-window.swift scripts/macos-p4-ax.swift scripts/macos-p4-display.swift -o tmp/lane-apple/p4/window-probe
          tmp/lane-apple/p4/window-probe preflight tmp/lane-apple/p4/preflight.png
        timeout-minutes: 5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare static Ghostty and JavaScript test fixtures
        run: |
          node scripts/rust-package-prereqs.mjs
          pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 30
      - name: Build the P4 Files fixtures
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
          P4_ELECTRON_HELPER_REV: be0aa03c92c553e5b3d3a9bdb75f63eddd83868b
        run: |
          cargo check --locked --workspace --all-targets
          cargo test --locked -p shellfox-desktop --bin shellfox files::
          cargo test --locked -p shellfox-desktop --test macos-folder-picker
          cargo test --locked -p shellfox-files --all-targets
          cargo build --locked -p shellfox-desktop --bin shellfox -p shellfox-cli --bin shellfox-cli
          node scripts/tailscale.mjs build
          pnpm build:test
          p4="$PWD/tmp/lane-apple/p4"
          mkdir -p "$p4/go-work"
          (cd native/tailscale && CGO_ENABLED=0 GOTMPDIR="$p4/go-work" go build -mod=readonly -o "$p4/testcontrol" ./cmd/testcontrol)
          CGO_ENABLED=0 GOTMPDIR="$p4/go-work" go build -trimpath -o "$p4/electron-test-remote-helper" ./tests/fixtures/remote-helper/main.go
          legacy="$PWD/tmp/lane-apple/p4-electron"
          mkdir -p "$legacy/src" "$legacy/tmp/tailscale/darwin-${{ matrix.arch }}" "$legacy/go-work"
          git archive "$P4_ELECTRON_HELPER_REV" native/tailscale | tar -x -C "$legacy/src"
          (cd "$legacy/src/native/tailscale" && CGO_ENABLED=0 GOTMPDIR="$legacy/go-work" go build -mod=readonly \
            -o "$legacy/tmp/tailscale/darwin-${{ matrix.arch }}/shellfox-tailscale" .)
        timeout-minutes: 30
      - name: Compare local Files, native preview and peer transfers in both apps
        run: |
          p4="$PWD/tmp/lane-apple/p4"
          node scripts/macos-p4-files.mjs \
            --rust "$CARGO_TARGET_DIR/debug/shellfox" \
            --cli "$CARGO_TARGET_DIR/debug/shellfox-cli" \
            --helper "$PWD/tmp/dev-helper/shellfox-tailscale" \
            --electron "$PWD/tmp/build-test/main/index.cjs" \
            --electron-project "$PWD/tmp/lane-apple/p4-electron" \
            --electron-remote-helper "$p4/electron-test-remote-helper" \
            --testcontrol "$p4/testcontrol" \
            --artifacts "$p4" \
            --probe "$p4/window-probe"
        timeout-minutes: 25
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-p4-files-${{ matrix.arch }}
          path: |
            tmp/lane-apple/p4/preflight.png
            tmp/lane-apple/p4/files-*/**/*.png
            tmp/lane-apple/p4/files-*/**/*.json
            tmp/lane-apple/p4/files-*/**/*.log
          if-no-files-found: warn
      - name: Remove Cargo build directory
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
        timeout-minutes: 5

  ios:
    if: github.ref == 'refs/heads/experiment/ghostty-rust'
    name: iOS app, native contracts and native v1 simulator
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/lane-apple-ios/target
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install dependencies, generate terminal page and test RN native contracts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/mobile-terminal.mjs
          node --test mobile/ios/scripts/contracts.test.mjs
        timeout-minutes: 10
      - name: Identify the Xcode SDK
        id: sdk
        run: echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        timeout-minutes: 2
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: ios-frameworks
        with:
          path: |
            tmp/mobile-rust/ios/
            tmp/mobile-native/ios/
            tmp/ios-rust-build/*-link.txt
          key: >-
            apple-ios-frameworks-v2-${{ runner.arch }}-${{ steps.sdk.outputs.key }}-${{ hashFiles(
            'Cargo.*', 'rust-toolchain.toml', 'crates/*.rs', 'crates/ghostty-vt*/**',
            'crates/shellfox-client/**', 'crates/shellfox-core/**', 'crates/shellfox-mobile/**', 'crates/shellfox-protocol/**',
            'native/mobile/**', 'native/tailscale/go.*', 'native/tailscale/controlurl/**', 'native/tailscale/nethealth/**',
            'native/tailscale/TAILSCALE-LICENSE', 'mobile/ios/scripts/build-rust.mjs',
            'scripts/mobile-native.mjs', 'scripts/rust-package-prereqs.mjs', 'package.json') }}
      - name: Build Rust static libraries for device and simulator
        if: steps.ios-frameworks.outputs.cache-hit != 'true'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          node mobile/ios/scripts/build-rust.mjs --fetch-zig
        timeout-minutes: 35
      - name: Build embedded Go transport
        if: steps.ios-frameworks.outputs.cache-hit != 'true'
        run: |
          node scripts/mobile-native.mjs setup
          node scripts/mobile-native.mjs build ios
        timeout-minutes: 25
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.ios-frameworks.outputs.cache-hit != 'true'
        with:
          path: |
            tmp/mobile-rust/ios/
            tmp/mobile-native/ios/
            tmp/ios-rust-build/*-link.txt
          key: ${{ steps.ios-frameworks.outputs.cache-primary-key }}
      - name: Install Pods with the native XCTest target
        id: pods
        working-directory: mobile/ios
        env:
          SHELLFOX_IOS_NATIVE_TESTS: '1'
        run: pod install
        timeout-minutes: 15
      - name: Build unsigned simulator application
        id: simulator-app
        shell: bash
        run: |
          xcodebuild -workspace mobile/ios/ShellfoxMobile.xcworkspace \
            -scheme ShellfoxMobile -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath tmp/ios-derived \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee tmp/ios-app-build.log
        timeout-minutes: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && steps.simulator-app.outcome == 'failure'
        with:
          name: ios-simulator-build-failure
          path: tmp/ios-app-build.log
      - name: Run native contracts on an available iPhone simulator
        id: native-contracts
        shell: bash
        run: |
          simulator=$(xcrun simctl list devices booted available -j | node -e '
            const { devices } = JSON.parse(require("node:fs").readFileSync(0));
            console.log(Object.values(devices).flat().find(d => d.name.startsWith("iPhone"))?.udid ?? "");')
          if [ -z "$simulator" ]; then
            simulator=$(xcrun simctl list devices available -j | node -e '
              const { devices } = JSON.parse(require("node:fs").readFileSync(0));
              console.log(Object.values(devices).reverse().flat().find(d => d.name.startsWith("iPhone"))?.udid ?? "");')
            test -n "$simulator"
            xcrun simctl boot "$simulator"
          fi
          # Do not keep the iPhone running while the iPad UI fixture boots.
          trap 'xcrun simctl shutdown "$simulator"' EXIT
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild -workspace mobile/ios/ShellfoxMobile.xcworkspace \
            -scheme ShellfoxRustNative -sdk iphonesimulator -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath tmp/ios-derived \
            -resultBundlePath tmp/ios-native-tests.xcresult -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tmp/ios-native-tests.log
        timeout-minutes: 25
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && steps.native-contracts.outcome == 'failure'
        with:
          name: ios-native-contracts-failure
          path: tmp/ios-native-tests.log
      - name: Build isolated Rust host and loopback testcontrol
        id: ui-host
        if: ${{ !cancelled() && steps.pods.outcome == 'success' }}
        run: |
          mkdir -p tmp/lane-apple-ios
          node scripts/rust-package-prereqs.mjs
          node scripts/tailscale.mjs build
          (cd native/tailscale && go build -mod=readonly -o ../../tmp/lane-apple-ios/testcontrol ./cmd/testcontrol)
        timeout-minutes: 25
      - name: Build the Rust headless CLI
        id: ui-cli
        if: ${{ !cancelled() && steps.ui-host.outcome == 'success' }}
        run: cargo build --locked -p shellfox-cli --bin shellfox-cli
        timeout-minutes: 20
      - name: Build unsigned native v1 UI fixture
        id: ui-app
        if: ${{ !cancelled() && steps.ui-cli.outcome == 'success' }}
        run: |
          ruby -e 'require "xcodeproj"' || gem install xcodeproj --version 1.27.0 --no-document
          ruby mobile/ios/scripts/prepare-native-v1-fixture.rb
          xcodebuild -workspace mobile/ios/ShellfoxMobile.xcworkspace \
            -scheme ShellfoxNativeV1UI -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath tmp/ios-fixture-derived \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build-for-testing
        timeout-minutes: 25
      - name: Native v1 pairing, PTY, rotation, live outage, foreground recovery and file save
        if: ${{ !cancelled() && steps.ui-app.outcome == 'success' }}
        run: node mobile/ios/scripts/native-v1-simulator.mjs
        timeout-minutes: 30
      - name: Export UI screenshots from the XCTest result
        if: always()
        run: |
          if [ -f tmp/ios-native-v1-results/native-v1.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path tmp/ios-native-v1-results/native-v1.xcresult \
              --output-path tmp/ios-native-v1-results/screenshots
          fi
        timeout-minutes: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-simulator-results
          path: |
            tmp/ios-derived/Build/Products/Debug-iphonesimulator/ShellfoxMobile.app
            tmp/ios-native-tests.xcresult
            tmp/ios-native-v1-results/
            tmp/ios-rust-build/*-link.txt
          if-no-files-found: ignore
      - name: Remove Cargo build directory
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
        timeout-minutes: 5
