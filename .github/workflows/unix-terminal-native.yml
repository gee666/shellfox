name: Unix terminal ownership

on:
  workflow_dispatch:
  push:
    branches: [experiment/ghostty-rust]
    paths:
      - 'crates/shellfox-terminal/**'
      - 'crates/shellfox-service/**'
      - 'crates/shellfox-cli/**'
      - 'crates/shellfox-desktop/src/smoke.rs'
      - 'scripts/rust-root-smoke.mjs'
      - 'src/main/terminal/native/darwin-terminal-supervisor.c'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/darwin-supervisor-model-test.mjs'
      - 'src/main/terminal/native/tests/darwin-supervisor-model.c'
      - '.github/workflows/unix-terminal-native.yml'
  pull_request:
    paths:
      - 'crates/shellfox-terminal/**'
      - 'crates/shellfox-service/**'
      - 'crates/shellfox-cli/**'
      - 'crates/shellfox-desktop/src/smoke.rs'
      - 'scripts/rust-root-smoke.mjs'
      - 'src/main/terminal/native/darwin-terminal-supervisor.c'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/darwin-supervisor-model-test.mjs'
      - 'src/main/terminal/native/tests/darwin-supervisor-model.c'
      - '.github/workflows/unix-terminal-native.yml'

permissions:
  contents: read

jobs:
  native-ownership:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Runner architecture does not match the target")'
      - name: Install pinned Rust
        run: rustup show
      - name: Production automation runs, user tab environment, macOS PTY
        run: cargo test --locked -p shellfox-terminal --features test-support --test raw_process_unix --test user_environment_unix --test macos_pty --no-fail-fast
      - name: Build retained Darwin supervisor
        if: runner.os == 'macOS'
        run: |
          node crates/shellfox-terminal/tests/native/build-darwin.mjs
          node -e 'const p=require("node:path"); require("node:fs").appendFileSync(process.env.GITHUB_ENV, "SHELLFOX_DARWIN_SUPERVISOR="+p.resolve("tmp/terminal-native/darwin-"+process.arch+"/shellfox-terminal-supervisor")+"\n")'
      - name: Linux session containment, pretending there is no user delegation
        if: runner.os == 'Linux'
        env:
          SHELLFOX_TEST_LINUX_CONTAINMENT: session
        run: cargo test --locked -p shellfox-terminal --features test-support --test unix_production --test raw_process_unix --test unix_session_fallback --no-fail-fast
      - name: Contract tests and native fixture build
        run: cargo test --locked -p shellfox-terminal --features test-support --lib --test unix_native --no-fail-fast
      - name: Retained C control-flow model
        run: node scripts/darwin-supervisor-model-test.mjs
      - name: Native PTY ownership
        # A failure shows where the error came from.
        env:
          RUST_LIB_BACKTRACE: '1'
        run: cargo test --locked -p shellfox-terminal --features test-support --test unix_native -- --ignored --test-threads=1
      - name: Scoped Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p shellfox-terminal --features test-support --all-targets -- -D warnings
      - name: Retain native helper evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: darwin-supervisor-${{ matrix.os }}
          path: tmp/terminal-native/darwin-*/supervisor-manifest.json
          if-no-files-found: error

  # Root in a container without systemd: what servers, Docker and WSL distros
  # without systemd run. Terminals use session containment there.
  linux-root-container:
    name: Linux as root without systemd (Ubuntu 20.04)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      GOTOOLCHAIN: local
      SHELLFOX_UBUNTU_MIRROR: ${{ vars.SHELLFOX_UBUNTU_MIRROR }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sudo git ca-certificates curl xz-utils zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      # The checkout belongs to the runner's account. A root host rightly
      # refuses data directories under another account's tree.
      - name: Root owns the checkout
        run: |
          chown -R root:root "$GITHUB_WORKSPACE"
          chown root:root "$(dirname "$GITHUB_WORKSPACE")" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
      - name: Root, no systemd, pinned Rust
        run: |
          test "$(id -u)" = 0
          test ! -d /run/systemd/system
          rustup toolchain install 1.97.1 --profile minimal
      - name: Build dependencies
        run: |
          bash .github/scripts/setup-ubuntu-apt.sh
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev libudev-dev acl
      - name: Terminal tests as root
        run: cargo test --locked -p shellfox-terminal --features test-support --no-fail-fast
      - name: Prepare pinned Ghostty
        run: node scripts/rust-package-prereqs.mjs
        timeout-minutes: 35
      - name: Build desktop, CLI and fixtures
        run: |
          echo "GHOSTTY_VT_DIR=$PWD/tmp/rust-package-ghostty/x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
          export GHOSTTY_VT_DIR="$PWD/tmp/rust-package-ghostty/x86_64-unknown-linux-gnu"
          cargo build --locked -p shellfox-desktop -p shellfox-cli
          cargo build --locked -p shellfox-terminal --features test-support --bin shellfox-raw-test-helper
      - name: Service tests as root
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p shellfox-service --lib --no-fail-fast
          SHELLFOX_RAW_TEST_HELPER="$PWD/target/debug/shellfox-raw-test-helper" cargo test --locked -p shellfox-service --lib automation -- --ignored
      - name: Desktop smoke and CLI round trip as root
        if: ${{ !cancelled() }}
        run: node scripts/rust-root-smoke.mjs target/debug
