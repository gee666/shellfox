name: Release
# Push a tag vX.Y.Z (matching package.json "version") to package Shellfox for
# Windows, Linux, macOS and Android, then publish the installers together.
# `shellfox update` and the in-app update notice read the latest published release.
# A pre-release tag such as v0.10.0-beta.1 always publishes a GitHub pre-release.
# Updaters read only the latest stable release, so testers alone get it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  SHELLFOX_UBUNTU_MIRROR: ${{ vars.SHELLFOX_UBUNTU_MIRROR }}
  SHELLFOX_UBUNTU_PORTS_MIRROR: ${{ vars.SHELLFOX_UBUNTU_PORTS_MIRROR }}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mobile:
    name: signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TMP: ${{ github.workspace }}/tmp
      TEMP: ${{ github.workspace }}/tmp
      TMPDIR: ${{ github.workspace }}/tmp
      GRADLE_USER_HOME: ${{ github.workspace }}/tmp/gradle-home
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Scratch directory
        run: mkdir -p tmp
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Ubuntu archive setup
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-ubuntu-apt.sh
        timeout-minutes: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install pinned Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
        timeout-minutes: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 5
      - name: Typecheck desktop and mobile
        run: pnpm typecheck
        timeout-minutes: 5
      - name: Install browser test prerequisites
        run: bash .github/scripts/install-browser-tests.sh
        timeout-minutes: 15
      - name: Mobile updater and build contracts
        run: pnpm test:unit mobile/src && node --test scripts/mobile-build.test.mjs scripts/mobile-e2e-controls.test.mjs
        timeout-minutes: 5
      - name: Native mobile tests
        run: pnpm test:mobile:native
        timeout-minutes: 10
      - name: Build Android Rust and Ghostty libraries
        timeout-minutes: 30
        shell: bash
        run: |
          zig_manifest=./crates/ghostty-vt-sys/build-support/zig-0.17.0.json
          zig_url=$(node -p "require('$zig_manifest').hosts['x86_64-linux'].url")
          zig_sha=$(node -p "require('$zig_manifest').hosts['x86_64-linux'].sha256")
          curl --fail --location --max-time 120 "$zig_url" --output tmp/zig.tar.xz
          printf '%s  %s\n' "$zig_sha" tmp/zig.tar.xz | sha256sum -c -
          mkdir -p tmp/zig
          tar -xJf tmp/zig.tar.xz --strip-components=1 -C tmp/zig
          targets=(aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android)
          rustup target add "${targets[@]}"
          for target in "${targets[@]}"; do cargo fetch --locked --target "$target"; done
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          node crates/shellfox-mobile/build-mobile.mjs build-android --zig "$PWD/tmp/zig/zig"
      - name: Build and verify signed stable APK
        run: node scripts/mobile-build.mjs
        timeout-minutes: 40
        env:
          SHELLFOX_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHELLFOX_ANDROID_KEYSTORE_BASE64 }}
          SHELLFOX_ANDROID_STORE_PASSWORD: ${{ secrets.SHELLFOX_ANDROID_STORE_PASSWORD }}
          SHELLFOX_ANDROID_KEY_ALIAS: ${{ secrets.SHELLFOX_ANDROID_KEY_ALIAS }}
          SHELLFOX_ANDROID_KEY_PASSWORD: ${{ secrets.SHELLFOX_ANDROID_KEY_PASSWORD }}
          SHELLFOX_ANDROID_CERT_SHA256: ${{ secrets.SHELLFOX_ANDROID_CERT_SHA256 }}
      - name: Build isolated native terminal fixture
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon --console=plain -PshellfoxAndroidTestBuildType=nativeFixture
          -PreactNativeArchitectures=x86_64 :app:assembleNativeFixture :app:assembleNativeFixtureAndroidTest
        timeout-minutes: 10
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            (cd mobile/android && ANDROID_SERIAL=emulator-5554 ./gradlew --no-daemon --console=plain -PshellfoxAndroidTestBuildType=nativeFixture -PreactNativeArchitectures=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.shellfox.mobile.rust.NativeTerminalFixtureTest :app:connectedNativeFixtureAndroidTest)
            node scripts/mobile-e2e.mjs --apk "$(find tmp/mobile-artifacts -name '*.apk' -print -quit)"
      - name: Mobile failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-diagnostics
          path: |
            tmp/mobile-e2e
            mobile/android/app/build/outputs/androidTest-results/connected/nativeFixture/
            tmp/mobile-artifacts/apksigner-verification.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: shellfox-mobile-android
          path: |
            tmp/mobile-artifacts/shellfox-mobile-*-android.apk
            tmp/mobile-artifacts/shellfox-mobile-*-android.apk.sha256
          if-no-files-found: error
  package:
    name: package ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: x64, target: x86_64-unknown-linux-gnu, container: 'ubuntu:20.04' }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu, container: 'ubuntu:20.04' }
          - { runner: windows-2022, platform: win32, arch: x64, target: x86_64-pc-windows-msvc }
          - { runner: macos-15, platform: darwin, arch: arm64, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, platform: darwin, arch: x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Linux builds run in Ubuntu 20.04 so packages need only glibc 2.31
    # (scripts/package-rust-glibc.mjs checks it). Empty means the runner itself.
    container: ${{ matrix.container }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/release/target
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Ubuntu 20.04 container prerequisites
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sudo git ca-certificates curl xz-utils zstd
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Native runner, tag and Rust toolchain
        run: |
          node -e "if(process.platform !== '${{ matrix.platform }}' || process.arch !== '${{ matrix.arch }}') throw new Error('Wrong native runner')"
          node -e "const v=require('./package.json').version; if(process.env.GITHUB_REF_TYPE === 'tag' && 'v'+v !== process.env.GITHUB_REF_NAME) throw new Error('Tag does not match package.json')"
          rustup set default-host '${{ matrix.target }}'
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Linux GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/setup-ubuntu-apt.sh
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev libudev-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Windows'
      - name: Windows installer and managed helper tools
        if: runner.os == 'Windows'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/dotnet-sdk.mjs provision
          # Git Bash's /usr/bin/link shadows MSVC's link.exe on PATH.
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$(dirname "$(command -v cl.exe)")/link.exe")" >> "$GITHUB_ENV"
      - name: Prepare pinned Ghostty
        run: node scripts/rust-package-prereqs.mjs
        timeout-minutes: 35
      - name: Package Rust desktop and headless
        run: node scripts/package-rust.mjs
        timeout-minutes: 50
      - name: Smoke extracted package
        run: node scripts/package-rust-smoke.mjs
        timeout-minutes: 5
      - name: Smoke headless archive without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY node scripts/package-rust-headless.mjs
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: shellfox-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: tmp/rust-installers/
          if-no-files-found: error
  release:
    name: publish GitHub release
    needs: [package, mobile]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: shellfox-*
          merge-multiple: true
      - name: Release files
        run: find dist -type f -exec ls -l {} \;
      - uses: softprops/action-gh-release@v2
        with:
          name: Shellfox ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.deb
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.nupkg
            dist/**/RELEASES
            dist/**/*.dmg
            dist/**/*.tar.gz
            dist/**/*.sha256
            dist/**/*.apk
