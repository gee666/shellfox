name: Linux workspace checks

# Compile, lint and test the Rust workspace on Linux on every push, so
# Linux-only errors don't wait for a release run. The glibc floor is checked
# by the release workflow's Ubuntu 20.04 build.
on:
  workflow_dispatch:
  push:
    branches: [experiment/ghostty-rust]
    paths:
      - .github/workflows/linux-check.yml
      - .github/actions/pinned-ghostty/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - vendor/**
      - scripts/tailscale.mjs
      - scripts/rust-package-prereqs.mjs

permissions:
  contents: read

jobs:
  linux:
    name: linux-${{ matrix.arch }} check, clippy and tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      GOTOOLCHAIN: local
      SHELLFOX_UBUNTU_MIRROR: ${{ vars.SHELLFOX_UBUNTU_MIRROR }}
      SHELLFOX_UBUNTU_PORTS_MIRROR: ${{ vars.SHELLFOX_UBUNTU_PORTS_MIRROR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      # The runtime recovery tests compare against @xterm/headless.
      - name: Node test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rust pin
        run: rustup show
      - name: GPUI build dependencies
        run: |
          bash .github/scripts/setup-ubuntu-apt.sh
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev libudev-dev acl xvfb xauth xdotool mesa-vulkan-drivers
      - name: Prepare pinned Ghostty
        uses: ./.github/actions/pinned-ghostty
        timeout-minutes: 35
      - name: Check
        id: check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Crates whose behavior differs on Linux. The tests run even when clippy fails.
      - name: Terminal tests
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo test --locked -p shellfox-terminal --features test-support --no-fail-fast
      - name: Runtime, service, CLI and Files tests
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo test --locked -p shellfox-runtime -p shellfox-service -p shellfox-cli -p shellfox-files --no-fail-fast
      # A real X11 window (Xvfb + Mesa's software Vulkan): GPUI's X11 backend
      # differs from Wayland, and a GUI-only panic must fail CI.
      - name: Desktop window under X11
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: |
          cargo build --locked -p shellfox-cli
          env -u WAYLAND_DISPLAY xvfb-run -a cargo test --locked -p shellfox-desktop --test launch_smoke
      # A minute of typing, Files panel, new tabs and resizes; any UI exit fails.
      - name: Desktop soak under X11
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        timeout-minutes: 10
        run: env -u WAYLAND_DISPLAY SHELLFOX_X11_SOAK=1 xvfb-run -a -s '-screen 0 1920x1080x24' cargo test --locked -p shellfox-desktop --test x11_soak -- --nocapture
      - name: Service automation against the owned raw fixture
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: |
          cargo build --locked -p shellfox-terminal --features test-support --bin shellfox-raw-test-helper
          SHELLFOX_RAW_TEST_HELPER="$PWD/target/debug/shellfox-raw-test-helper" \
            cargo test --locked -p shellfox-service --lib automation -- --ignored
