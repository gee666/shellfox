apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../..")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    hermesCommand = file("../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc" +
        (org.gradle.internal.os.OperatingSystem.current().isWindows() ? ".exe" : "")).absolutePath
    autolinkLibrariesWithApp()
}

// Root package.json is the release version authority, including direct Gradle builds.
def manifest = new groovy.json.JsonSlurper().parse(file("../../../package.json"))
def versionParts = manifest.version.tokenize('.').collect { it.toInteger() }
if (!(manifest.version ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/) ||
    versionParts.size() != 3 || versionParts.any { it < 0 || it > 999 }) {
    throw new GradleException("Mobile versions must have three stable components between 0 and 999.")
}
def releaseCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
if (releaseCode < 1) throw new GradleException("Mobile versionCode must be positive.")
def signingKeys = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
def upload = signingKeys.collectEntries { [(it): providers.gradleProperty("SHELLFOX_UPLOAD_${it}").orNull] }
def hasUploadSigning = upload.values().every { it != null && !it.isEmpty() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.shellfox.mobile"
    sourceSets.main.assets.srcDirs += [file("../../../tmp/mobile-native/android/assets")]
    defaultConfig {
        applicationId "com.shellfox.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        versionCode releaseCode
        versionName manifest.version
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadSigning) {
            release {
                storeFile file(upload.STORE_FILE)
                storePassword upload.STORE_PASSWORD
                keyAlias upload.KEY_ALIAS
                keyPassword upload.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            // Missing secrets never select the debug keystore.
            if (hasUploadSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        preview {
            initWith release
            matchingFallbacks = ['release']
            // Embedded JS, no Metro or developer support. Never published as a stable asset.
            signingConfig signingConfigs.debug
            debuggable false
        }
    }
}

// Also guard direct Gradle invocations, not only scripts/mobile-build.mjs.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!hasUploadSigning) throw new GradleException("Release APK requires all SHELLFOX_UPLOAD_* signing properties.")
        if (!file(upload.STORE_FILE).isFile()) throw new GradleException("Release keystore is missing.")
        if (file(upload.STORE_FILE).canonicalFile == file('debug.keystore').canonicalFile || upload.KEY_ALIAS == 'androiddebugkey') {
            throw new GradleException("Debug signing is forbidden for release APKs.")
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.16.0")
    implementation(files("../../../tmp/mobile-native/android/shellfox-mobile.aar"))
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation('io.github.react-native-community:jsc-android:2026004.+')
    }
}
