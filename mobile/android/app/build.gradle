apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../..")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    debuggableVariants = ["debug", "nativeFixture"]
    hermesCommand = file("../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc" +
        (org.gradle.internal.os.OperatingSystem.current().isWindows() ? ".exe" : "")).absolutePath
    autolinkLibrariesWithApp()
}

// Root package.json is the release version authority, including direct Gradle builds.
def manifest = new groovy.json.JsonSlurper().parse(file("../../../package.json"))
def versionParts = manifest.version.tokenize('.').collect { it.toInteger() }
if (!(manifest.version ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/) ||
    versionParts.size() != 3 || versionParts.any { it < 0 || it > 999 }) {
    throw new GradleException("Mobile versions must have three stable components between 0 and 999.")
}
def releaseCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
if (releaseCode < 1) throw new GradleException("Mobile versionCode must be positive.")
def signingKeys = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
def upload = signingKeys.collectEntries { [(it): providers.gradleProperty("SHELLFOX_UPLOAD_${it}").orNull] }
def hasUploadSigning = upload.values().every { it != null && !it.isEmpty() }
def goAndroidDir = file(providers.gradleProperty("shellfoxGoAndroidDir")
    .getOrElse("../../../tmp/mobile-native/android"))
def shellfoxNode = {
    def explicitNode = providers.gradleProperty("shellfoxNodeExecutable").orNull
    def node = explicitNode == null ? react.nodeExecutableAndArgs.get() : [explicitNode]
    if (node.isEmpty() || node.any { it == null || it.toString().trim().isEmpty() }) {
        throw new GradleException("Configure a valid RN Node executable for artifact validation.")
    }
    node
}
def artifactValidator = file("../validate-rust-artifacts.mjs")
def managerV2 = providers.gradleProperty("shellfoxManagerV2").getOrElse("false")
if (!(managerV2 in ["true", "false"])) throw new GradleException("shellfoxManagerV2 must be true or false.")
def nativeManager = managerV2 == "true"
def rustAndroidDir = objects.directoryProperty()
def configuredRustDir = providers.gradleProperty("shellfoxRustAndroidDir")
if (configuredRustDir.isPresent()) rustAndroidDir.set(file(configuredRustDir.get()))
else rustAndroidDir.set(providers.provider {
    // The producer owns the default output path/selector; Gradle has no second
    // hardcoded directory. This reads metadata only and never builds libraries.
    def selected = providers.exec {
        commandLine(shellfoxNode() + [artifactValidator.absolutePath, "--print-default-artifact-dir"])
    }.standardOutput.asText.get().trim()
    if (selected.isEmpty()) throw new GradleException("No complete Rust Android build-output directory selected.")
    file(selected)
})
rustAndroidDir.finalizeValueOnRead()

// Validate the selected files/declarations before native configuration/linking.
// This does not replace the linker's actual symbol or runtime acceptance gates.
def validateRustArtifacts = tasks.register("validateShellfoxRustArtifacts", Exec) {
    doFirst {
        def abis = providers.gradleProperty("reactNativeArchitectures")
            .getOrElse("armeabi-v7a,arm64-v8a,x86,x86_64")
        commandLine(shellfoxNode() + [artifactValidator.absolutePath,
            "--artifact-dir", rustAndroidDir.get().asFile.absolutePath, "--abis", abis] +
            (nativeManager ? ["--native002"] : []))
    }
}
tasks.configureEach { task ->
    if (task.name == "preBuild" || task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) {
        task.dependsOn(validateRustArtifacts)
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.shellfox.mobile"
    testBuildType providers.gradleProperty("shellfoxAndroidTestBuildType").getOrElse("debug")
    sourceSets.main.assets.srcDirs += [new File(goAndroidDir, "assets")]
    sourceSets.androidTest.assets.srcDirs += [file("../../../crates/shellfox-client/tests/fixtures")]
    externalNativeBuild {
        cmake {
            path file("src/main/jni/CMakeLists.txt")
            version "3.22.1"
        }
    }
    defaultConfig {
        applicationId "com.shellfox.mobile"
        buildConfigField "boolean", "SHELLFOX_MANAGER_V2", nativeManager.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        versionCode releaseCode
        versionName manifest.version
        externalNativeBuild {
            cmake {
                arguments "-DSHELLFOX_RUST_ANDROID_DIR=" + rustAndroidDir.get().asFile.absolutePath,
                    "-DSFM_ENABLE_MANAGER_V2=" + (nativeManager ? "ON" : "OFF")
            }
        }
    }
    testOptions {
        unitTests.all {
            def scratch = file("../../../tmp/android-rust-tests")
            scratch.mkdirs()
            systemProperty "java.io.tmpdir", scratch.absolutePath
            systemProperty "maven.repo.local", new File(scratch, "maven").absolutePath
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadSigning) {
            release {
                storeFile file(upload.STORE_FILE)
                storePassword upload.STORE_PASSWORD
                keyAlias upload.KEY_ALIAS
                keyPassword upload.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        nativeFixture {
            initWith debug
            applicationIdSuffix ".nativefixture"
            matchingFallbacks = ['debug']
        }
        release {
            // Missing secrets never select the debug keystore.
            if (hasUploadSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        preview {
            initWith release
            matchingFallbacks = ['release']
            // Embedded JS, no Metro or developer support. Never published as a stable asset.
            signingConfig signingConfigs.debug
            debuggable false
        }
        terminalTest {
            initWith preview
            applicationIdSuffix ".terminaltest"
            matchingFallbacks = ['release']
        }
    }
}

// Also guard direct Gradle invocations, not only scripts/mobile-build.mjs.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!hasUploadSigning) throw new GradleException("Release APK requires all SHELLFOX_UPLOAD_* signing properties.")
        if (!file(upload.STORE_FILE).isFile()) throw new GradleException("Release keystore is missing.")
        if (file(upload.STORE_FILE).canonicalFile == file('debug.keystore').canonicalFile || upload.KEY_ALIAS == 'androiddebugkey') {
            throw new GradleException("Debug signing is forbidden for release APKs.")
        }
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.16.1")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.16.0")
    implementation(files(new File(goAndroidDir, "shellfox-mobile.aar")))
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation('io.github.react-native-community:jsc-android:2026004.+')
    }
}
