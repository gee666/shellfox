[package]
name = "shellfox-mobile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
experimental-shellfox-native = ["shellfox-ghostty-vt/experimental-shellfox-native"]

[dependencies]
shellfox-ghostty-vt = { path = "../ghostty-vt" }
shellfox-protocol = { path = "../shellfox-protocol" }
shellfox-client = { path = "../shellfox-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
