[package]
name = "shellfox-remote"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
shellfox-core = { path = "../shellfox-core" }
shellfox-protocol = { path = "../shellfox-protocol" }
shellfox-transport = { path = "../shellfox-transport", features = ["helper", "host-auth"] }
shellfox-files = { path = "../shellfox-files" }

[dev-dependencies]
shellfox-test-support = { path = "../shellfox-test-support" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
