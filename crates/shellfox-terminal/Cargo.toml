[package]
name = "shellfox-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
test-support = []

[[bin]]
name = "shellfox-pty-test-helper"
path = "tests/support/helper.rs"
required-features = ["test-support"]

[[bin]]
name = "shellfox-elevated-test-helper"
path = "tests/support/elevated_helper.rs"
required-features = ["test-support"]

[[bin]]
name = "shellfox-unix-test-supervisor"
path = "tests/support/unix_supervisor.rs"
required-features = ["test-support"]

[[bin]]
name = "shellfox-raw-test-helper"
path = "tests/support/raw_process_fixture.rs"
required-features = ["test-support"]

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[[bin]]
name = "shellfox-wsl-test-helper"
path = "tests/support/wsl_fake.rs"
required-features = ["test-support"]
