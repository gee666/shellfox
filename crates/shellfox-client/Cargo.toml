[package]
name = "shellfox-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
local-host = ["shellfox-protocol/local-host"]

[dependencies]
shellfox-protocol = { path = "../shellfox-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures = "0.3"
