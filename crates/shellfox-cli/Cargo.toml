[package]
name = "shellfox-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
thiserror.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"
socket2 = "0.6"
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
shellfox-core = { path = "../shellfox-core" }
shellfox-files = { path = "../shellfox-files" }
shellfox-host = { path = "../shellfox-host" }
shellfox-ghostty-vt = { path = "../ghostty-vt" }
shellfox-protocol = { path = "../shellfox-protocol" }
shellfox-client = { path = "../shellfox-client" }
shellfox-mobile = { path = "../shellfox-mobile" }
shellfox-service = { path = "../shellfox-service" }
shellfox-terminal = { path = "../shellfox-terminal" }
shellfox-ssh = { path = "../shellfox-ssh" }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt", "time", "net", "process", "signal", "sync", "macros"] }
zeroize = "1"
# Headless `shellfox update`, same client and checks as the desktop updater.
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["rustls-tls-native-roots"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }
# The raw fixture binary shares shellfox-terminal's process-control modes.
libc = "0.2"

[[bin]]
name = "shellfox-cli-raw-fixture"
path = "tests/support/raw_fixture_main.rs"
test = false
bench = false

[dev-dependencies]
# Moves stored session times back in the retention test.
rusqlite = { version = "=0.41.0", features = ["bundled"] }
