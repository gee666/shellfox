[package]
name = "shellfox-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
experimental-shellfox-native = ["shellfox-service/experimental-shellfox-native", "dep:shellfox-ghostty-vt", "shellfox-ghostty-vt/experimental-shellfox-native", "shellfox-mobile/experimental-shellfox-native"]

[dependencies]
anyhow.workspace = true
crossterm = "0.29"
thiserror.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"
socket2 = "0.6"
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
shellfox-core = { path = "../shellfox-core" }
shellfox-protocol = { path = "../shellfox-protocol" }
shellfox-client = { path = "../shellfox-client" }
shellfox-mobile = { path = "../shellfox-mobile" }
shellfox-ghostty-vt = { path = "../ghostty-vt", optional = true }
shellfox-service = { path = "../shellfox-service" }
shellfox-terminal = { path = "../shellfox-terminal" }
shellfox-ssh = { path = "../shellfox-ssh" }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt", "time", "net", "process", "signal"] }
zeroize = "1"

[[bin]]
name = "shellfox-cli-raw-fixture"
path = "tests/support/raw_fixture_main.rs"
test = false
bench = false

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
