[package]
name = "shellfox-ssh"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
shellfox-files = { path = "../shellfox-files" }
base64 = "0.22"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "=0.6.7", features = ["ed25519", "p256", "p384", "p521", "encryption"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
cbc = "=0.1.2"
hmac = "=0.12.1"
sha1 = "=0.10.6"
argon2 = { version = "=0.5.3", features = ["zeroize"] }
pkcs8 = { version = "=0.10.2", features = ["encryption", "pem", "sha1-insecure"] }
pkcs1 = { version = "=0.7.5", features = ["alloc"] }
pem-rfc7468 = { version = "=0.7.0", features = ["alloc"] }
p256 = { version = "=0.13.2", features = ["pem", "pkcs8"] }
p384 = { version = "=0.13.1", features = ["pem", "pkcs8"] }
p521 = { version = "=0.13.3", features = ["pem", "pkcs8"] }
ed25519-dalek = { version = "=2.2.0", features = ["pem", "pkcs8"] }
ring = "=0.17.14"
num-bigint-dig = { version = "=0.8.6", features = ["zeroize"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
anyhow.workspace = true
rand = "0.8"
