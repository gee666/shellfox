[package]
name = "shellfox-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
shellfox-core = { path = "../shellfox-core" }
shellfox-files = { path = "../shellfox-files" }
# RUSTSEC-2026-0459 requires bundled libsqlite3-sys >=0.39.0.
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
