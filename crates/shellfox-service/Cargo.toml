[package]
name = "shellfox-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-putty-source = []

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "=2.5.8"
roxmltree = "=0.20.0"
cap-std = "=3.4.6"
cap-fs-ext = "=3.4.6"
chrono = { version = "0.4", default-features = false }
tempfile = "3"
shellfox-core = { path = "../shellfox-core" }
shellfox-ghostty-vt.workspace = true
shellfox-host = { path = "../shellfox-host" }
shellfox-files = { path = "../shellfox-files" }
shellfox-runtime = { path = "../shellfox-runtime" }
shellfox-ssh = { path = "../shellfox-ssh" }
zeroize = "1"
rand = "0.8"
shellfox-terminal = { path = "../shellfox-terminal" }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "process", "time", "sync", "signal", "macros"] }
shellfox-protocol = { path = "../shellfox-protocol", features = ["local-host"] }
shellfox-client = { path = "../shellfox-client", features = ["local-host"] }
shellfox-transport = { path = "../shellfox-transport", features = ["helper"] }
shellfox-remote = { path = "../shellfox-remote" }
subtle = "2"

[target.'cfg(windows)'.dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking-api"] }

[dev-dependencies]
shellfox-test-support = { path = "../shellfox-test-support" }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
shellfox-mobile = { path = "../shellfox-mobile" }
sha2 = "0.10"

[[bin]]
name = "shellfox-test-supervisor"
path = "tests/support/supervisor_main.rs"
test = false
bench = false
